# ---------------------------------------------------------------------------
# Dungeon Flow - application configuration
# ---------------------------------------------------------------------------
# The game runs as a single process with NO external broker. Player moves are
# published straight into the Quarkus Flow engine's in-process event broker
# (see DungeonResource), so there is no smallrye-kafka / smallrye-in-memory
# wiring here on purpose (SRS constraint C-3).

quarkus.application.name=dungeon-flow
quarkus.http.port=8080

# Serve the whole game from ONE process (SRS constraint C-3): the SvelteKit build is copied into
# META-INF/resources and served at /, while every REST endpoint moves under /api - which is exactly
# the prefix the UI already calls (see web/src/lib/api.ts). This is what removes the need for an
# nginx reverse-proxy sidecar. Build-time property; see SpaFallbackRoute for the client-route rewrite.
quarkus.rest.path=/api

# ---------------------------------------------------------------------------
# Gameplay tuning (game *balance*, not game *rules* - rules live in the workflow)
# ---------------------------------------------------------------------------
# Lock-pick success probability per attempt in the Trap Corridor (0.0 - 1.0).
dungeon.lock.success-probability=0.5
# Force outcomes for demos/tests: RANDOM | ALWAYS_SUCCEED | ALWAYS_JAM
dungeon.lock.mode=RANDOM
# Max lock-pick attempts before the player is respawned to the fork (REQ-FUNC-004).
dungeon.trap.max-attempts=3
# Idle timeout on the fork before the torch goes out (ISO-8601 duration, REQ-FUNC-005).
dungeon.fork.torch-timeout=PT60S

# ---------------------------------------------------------------------------
# Observability - console narration IS part of the demo experience (SRS 8.3.6)
# ---------------------------------------------------------------------------
quarkus.flow.tracing.enabled=true
quarkus.log.category."org.acme.dungeon".level=INFO

# ---------------------------------------------------------------------------
# Test profile: make the game fast and deterministic
# ---------------------------------------------------------------------------
%test.quarkus.flow.tracing.enabled=true
%test.dungeon.fork.torch-timeout=PT2S
# Randomised HTTP port for parallel-safe integration tests
%test.quarkus.http.test-port=0

# ---------------------------------------------------------------------------
# Container image coordinates (REQ-FUNC-009)
# ---------------------------------------------------------------------------
# Naming only - deliberately NO build/push flags here. Setting those globally
# makes a plain `mvn package` build a Docker image and push it to a public
# registry as a side effect, which is a nasty surprise for anyone cloning the
# repo. Opt in explicitly per command instead (see README > Containerization):
#   mvn package -Dquarkus.container-image.build=true
#   mvn package -Dquarkus.container-image.build=true -Dquarkus.container-image.push=true
quarkus.container-image.registry=ghcr.io
quarkus.container-image.group=fmatar
quarkus.container-image.name=dungeon-flow
quarkus.container-image.tag=latest
