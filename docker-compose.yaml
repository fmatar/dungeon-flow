# One service, one container: Quarkus serves the SvelteKit UI at / and the game API
# under /api. The separate nginx frontend service is gone - it existed only to serve
# static files and reverse-proxy /api, both of which the backend now does itself
# (SRS constraint C-3). See deploy/datarobot/workload.yaml for why.
#
# The image is assembled by Maven, not by Docker, so there is no build: context here.
# Rebuild it from source with:
#   npm --prefix web run build
#   cp -R web/build/. src/main/resources/META-INF/resources/
#   mvn clean package -DskipTests -Dquarkus.container-image.build=true
services:
  app:
    # Overridable so the same compose file can run a native build without clobbering
    # the JVM :latest tag — `scripts/dungeon.sh --native` sets this to the
    # native-<arch> image it just built.
    image: ${DUNGEON_IMAGE:-ghcr.io/fmatar/dungeon-flow:latest}
    ports:
      # Single mapping, host side overridable: `mvn quarkus:dev` also wants 8080, and
      # publishing both 8080 and 5173 meant a busy 8080 aborted the whole `up` with
      # "address already in use" before any container started.
      #   DUNGEON_HOST_PORT=5173 docker compose up
      - "${DUNGEON_HOST_PORT:-8080}:8080"
    restart: unless-stopped
